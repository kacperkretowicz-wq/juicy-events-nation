# Konfiguracja Netlify — witryna statyczna budowana przez Vite.
# Po podpięciu repo Netlify wykryje te ustawienia automatycznie.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Bezpieczne nagłówki dla całej witryny.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Długi cache dla zahaszowanych assetów Vite.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
