# Wersja statyczna używana przez wdrożenie produkcyjne.
# Kod Vite pozostaje w repozytorium do dalszego rozwoju.

[build]
  publish = "netlify-release"

# Bezpieczne nagłówki dla całej witryny.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Długi cache dla zahaszowanych assetów Vite.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
